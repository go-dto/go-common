name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  COVERAGE_MIN: '80.0'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files must be formatted with gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce coverage
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          printf 'Total coverage: %s%% (minimum %s%%)\n' "$total" "$COVERAGE_MIN"
          awk -v total="$total" -v minimum="$COVERAGE_MIN" 'BEGIN { exit !(total >= minimum) }'

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Scan repository history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mongodb:
        image: mongo:8@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Test real database drivers
        env:
          MYSQL_TEST_DSN: 'root:pw@tcp(127.0.0.1:3306)/mysql'
          POSTGRES_TEST_DSN: 'postgres://postgres:pw@127.0.0.1:5432/postgres?sslmode=disable'
          MONGODB_TEST_URI: 'mongodb://127.0.0.1:27017'
        run: go test ./database/...

  redis-integration:
    name: Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.2.2-alpine@sha256:59b6e694653476de2c992937ebe1c64182af4728e54bb49e9b7a6c26614d8933
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Test real Redis cache and queue drivers
        env:
          REDIS_TEST_ADDR: '127.0.0.1:6379'
        run: go test -count=1 ./cache/redis ./broker/redis

  redis-secure-integration:
    name: Redis TLS and auth integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Generate ephemeral Redis TLS material
        shell: bash
        run: |
          cert_dir="$RUNNER_TEMP/go-common-redis-tls"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.crt" -days 1 \
            -subj '/CN=go-common Redis integration CA'
          openssl req -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/server.key" -out "$cert_dir/server.csr" \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          openssl x509 -req -in "$cert_dir/server.csr" \
            -CA "$cert_dir/ca.crt" -CAkey "$cert_dir/ca.key" \
            -CAcreateserial -out "$cert_dir/server.crt" -days 1 \
            -copy_extensions copy
          chmod 644 "$cert_dir/ca.crt" "$cert_dir/server.crt" "$cert_dir/server.key"
          redis_password="$(openssl rand -hex 24)"
          echo "::add-mask::$redis_password"
          echo "REDIS_TEST_PASSWORD=$redis_password" >> "$GITHUB_ENV"
          echo "REDIS_TEST_TLS_CA=$cert_dir/ca.crt" >> "$GITHUB_ENV"
          echo 'REDIS_TEST_TLS_SERVER_NAME=localhost' >> "$GITHUB_ENV"
          echo 'REDIS_TEST_ADDR=127.0.0.1:6380' >> "$GITHUB_ENV"

      - name: Start durable Redis with TLS and authentication
        shell: bash
        run: |
          cert_dir="$RUNNER_TEMP/go-common-redis-tls"
          docker run --detach --name go-common-redis-tls \
            --publish 6380:6379 \
            --volume "$cert_dir:/tls:ro" \
            redis:8.2.2-alpine@sha256:59b6e694653476de2c992937ebe1c64182af4728e54bb49e9b7a6c26614d8933 \
            redis-server \
              --port 0 \
              --tls-port 6379 \
              --tls-cert-file /tls/server.crt \
              --tls-key-file /tls/server.key \
              --tls-ca-cert-file /tls/ca.crt \
              --tls-auth-clients no \
              --requirepass "$REDIS_TEST_PASSWORD" \
              --appendonly yes \
              --appendfsync everysec \
              --maxmemory-policy noeviction
          for attempt in {1..30}; do
            if docker exec \
              -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" \
              go-common-redis-tls \
              redis-cli --tls --cacert /tls/ca.crt -h localhost ping >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs go-common-redis-tls
          exit 1

      - name: Test Redis cache and queue over verified TLS
        run: go test -count=1 ./cache/redis ./broker/redis

      - name: Verify Redis restart and reconnect startup
        shell: bash
        run: |
          docker exec \
            -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" \
            go-common-redis-tls \
            redis-cli --tls --cacert /tls/ca.crt -h localhost \
              set go-common:restart-probe retained >/dev/null
          docker restart go-common-redis-tls >/dev/null
          for attempt in {1..30}; do
            if docker exec \
              -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" \
              go-common-redis-tls \
              redis-cli --tls --cacert /tls/ca.crt -h localhost ping >/dev/null; then
              persisted="$(docker exec \
                -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" \
                go-common-redis-tls \
                redis-cli --tls --cacert /tls/ca.crt -h localhost \
                  get go-common:restart-probe)"
              if [[ "$persisted" != retained ]]; then
                echo 'Redis persistence probe was not retained after restart'
                exit 1
              fi
              go test -count=1 ./cache/redis ./broker/redis
              exit 0
            fi
            sleep 1
          done
          docker logs go-common-redis-tls
          exit 1

      - name: Stop secure Redis
        if: always()
        run: docker rm --force go-common-redis-tls >/dev/null 2>&1 || true
