image: golang:1.26@sha256:52d57e3542f28ad72e9a1084e209366d8ca6af04997636134c138d16702a70a6

stages:
  - test

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -mod=readonly
  COVERAGE_MIN: "80.0"
  GIT_DEPTH: "0"

cache:
  key: go-mod-$CI_COMMIT_REF_SLUG
  paths:
    - .go/pkg/mod/

test:
  stage: test
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - go vet ./...
    - go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
    - go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
    - go test -race -coverprofile=coverage.out ./...
    - total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"; printf 'Total coverage %s%% minimum %s%%\n' "$total" "$COVERAGE_MIN"; awk -v total="$total" -v minimum="$COVERAGE_MIN" 'BEGIN { exit !(total >= minimum) }'
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
